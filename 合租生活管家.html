<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合租生活管家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --paper:#FFFFFF; --ink:#1E2330; --muted:#6B7280; --line:#E3E6EB; --soft:#EEF0F3;
  --maggie:#F2A65A; --flora:#6FB07A; --lily:#E58BAE; --livia:#5F93D1;
  --warn:#D9822B; --bad:#D64545; --good:#2F9E6B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15181E;--paper:#1E222A;--ink:#ECEEF2;--muted:#9AA1AD;--line:#2E333D;--soft:#262B34}
}
:root[data-theme="dark"]{--bg:#15181E;--paper:#1E222A;--ink:#ECEEF2;--muted:#9AA1AD;--line:#2E333D;--soft:#262B34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}
header.top{padding:28px 0 8px}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.banner{margin:12px 0 0;padding:8px 12px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:13px}
.banner.hide{display:none}

/* hero: four roommates */
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 6px}
.mate{background:none;border:2px solid transparent;border-radius:16px;padding:12px 6px 10px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.mate:hover{background:var(--paper)}
.mate.me{border-color:var(--c);background:var(--paper)}
.mate svg{width:72px;height:72px;display:block;margin:0 auto 6px}
.mate .nm{font-weight:700;font-size:15px}
.mate .tag{font-size:12px;color:var(--muted)}
.mate .bal{font-size:13px;font-weight:500;margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0 0 4px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px -16px 20px;padding:0 16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 12px 10px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

section.panel{display:none}
section.panel.on{display:block}
h2{font-size:18px;margin:28px 0 10px}
h2:first-child{margin-top:0}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .m{font-size:13px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:26px;height:26px;flex:none}
.dot svg{width:26px;height:26px}

form.add{display:grid;gap:10px;grid-template-columns:repeat(6,1fr)}
form.add label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c6{grid-column:span 6}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;color:var(--ink);font-size:14px}
.chk input{display:none}
.chk svg{width:22px;height:22px}
.chk:has(input:checked){border-color:var(--ink);background:var(--soft)}
.chk:not(:has(input:checked)){opacity:.5}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--soft)}
:focus-visible{outline:2px solid var(--livia);outline-offset:2px}

.transfer{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.transfer:last-child{border-bottom:0}
.arrow{color:var(--muted)}

.chores{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chore{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.chore svg{width:44px;height:44px;flex:none}
.chore .area{font-weight:700}
.chore .what{font-size:13px;color:var(--muted)}
.chore.done{opacity:.6}
.chore.done .area{text-decoration:line-through}
.status{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.status.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.status.low{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.status.out{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.table-wrap{overflow-x:auto}
table.rota{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
table.rota th,table.rota td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.rota th{color:var(--muted);font-weight:500}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.ok{background:var(--good);color:#fff}
.seg button.on.low{background:var(--warn);color:#fff}
.seg button.on.out{background:var(--bad);color:#fff}

.mates{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:14px}
.card .head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.card .head svg{width:56px;height:56px}
.card .head .nm{font-weight:700;font-size:17px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:14px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card .edit{display:grid;gap:8px}
.todo li{margin:4px 0}
.todo{margin:0;padding-left:20px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
.toast.show{opacity:1}
.right{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.stat{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.stat div{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}

@media (max-width:640px){
  .crew{gap:4px}.mate svg{width:56px;height:56px}.mate{padding:10px 2px 8px}
  .chores,.mates{grid-template-columns:1fr}
  form.add{grid-template-columns:repeat(2,1fr)}
  .c2,.c3{grid-column:span 1}.c6,.c2.wide{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>合租生活管家</h1>
    <p class="sub">房租水电、值日、公用物品，四个人一目了然</p>
    <p class="banner" id="banner">正在连接共享数据…</p>
  </header>

  <div class="crew" id="crew"></div>
  <p class="hint" id="meHint">点自己的头像，告诉管家你是谁</p>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="home" aria-selected="true">总览</button>
    <button role="tab" data-tab="money" aria-selected="false">费用分摊</button>
    <button role="tab" data-tab="chores" aria-selected="false">清洁值日</button>
    <button role="tab" data-tab="items" aria-selected="false">公共物品</button>
    <button role="tab" data-tab="mates" aria-selected="false">室友面板</button>
  </nav>

  <section class="panel on" id="p-home"></section>

  <section class="panel" id="p-money">
    <h2>记一笔</h2>
    <form class="add box" id="expForm">
      <label class="c3">项目<input type="text" name="title" placeholder="例如：10 月电费" required maxlength="40"></label>
      <label class="c3">金额（元）<input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required></label>
      <label class="c2">谁付的<select name="payer" id="payerSel"></select></label>
      <label class="c2">类别<select name="cat"><option>房租</option><option>水电燃气</option><option>网费</option><option>日用品</option><option>伙食</option><option>其他</option></select></label>
      <label class="c2">日期<input type="date" name="date" required></label>
      <div class="c6"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">谁一起分摊</div><div class="checks" id="splitChecks"></div></div>
      <div class="c6 right"><button class="btn" type="submit">保存这笔费用</button></div>
    </form>
    <div id="moneyBody"></div>
  </section>

  <section class="panel" id="p-chores"></section>

  <section class="panel" id="p-items">
    <h2>登记物品</h2>
    <form class="add box" id="itemForm">
      <label class="c3 wide c2">物品名称<input type="text" name="name" placeholder="例如：卷纸、洗洁精、垃圾袋" required maxlength="30"></label>
      <label class="c2">第一个负责买的人<select name="buyer" id="buyerSel"></select></label>
      <div class="c6 right" style="grid-column:span 6"><button class="btn" type="submit">登记物品</button></div>
    </form>
    <div id="itemsBody"></div>
  </section>

  <section class="panel" id="p-mates"></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const MATES=[
  {n:'Maggie',c:'var(--maggie)',hex:'#F2A65A'},
  {n:'Flora',c:'var(--flora)',hex:'#6FB07A'},
  {n:'Lily',c:'var(--lily)',hex:'#E58BAE'},
  {n:'Livia',c:'var(--livia)',hex:'#5F93D1'}
];
const NAMES=MATES.map(m=>m.n);
const AREAS=[
  {a:'厨房',w:'台面、灶台、水槽、冰箱清理过期食物'},
  {a:'客厅',w:'扫拖地面、擦桌面、整理沙发'},
  {a:'卫生间',w:'马桶、淋浴间、洗手台、换垃圾袋'},
  {a:'垃圾与回收',w:'按收运日倒垃圾、分类回收、清洗垃圾桶'}
];
const STATUS_OPTS=['在家','外出','上课','上班','出差','回国了','请勿打扰'];
const COLS=['expenses','items','members','cleanlog'];
const mate=n=>MATES.find(m=>m.n===n)||MATES[0];

/* ---------- avatars (original cartoon girls) ---------- */
function avatar(name){
  const m=mate(name); const id='av'+name+Math.random().toString(36).slice(2,7);
  const skin='#FFE1C8';
  const face=`<circle cx="50" cy="57" r="21" fill="${skin}"/>
    <circle cx="42" cy="58" r="2.4" fill="#2A2A30"/><circle cx="58" cy="58" r="2.4" fill="#2A2A30"/>
    <ellipse cx="37" cy="65" rx="4" ry="2.4" fill="#F59A9A" opacity=".55"/><ellipse cx="63" cy="65" rx="4" ry="2.4" fill="#F59A9A" opacity=".55"/>
    <path d="M45.5 66.5 Q50 70.5 54.5 66.5" stroke="#B5524F" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const body=`<path d="M26 104 Q28 80 50 79 Q72 80 74 104Z" fill="${m.hex}" opacity=".95"/><rect x="45" y="74" width="10" height="8" fill="${skin}"/>`;
  let back='',front='';
  if(name==='Maggie'){ // short bob with straight fringe
    const h='#4A3226';
    back=`<path d="M24 58 Q22 27 50 26 Q78 27 76 58 L76 72 Q70 76 66 71 L66 60 L34 60 L34 71 Q30 76 24 72Z" fill="${h}"/>`;
    front=`<path d="M27 50 Q28 29 50 29 Q72 29 73 50 L73 47 Q62 42 50 43 Q38 42 27 47Z" fill="${h}"/>`;
  }else if(name==='Flora'){ // long wavy hair + flower
    const h='#7A4A30';
    back=`<path d="M22 58 Q18 25 50 24 Q82 25 78 58 Q83 77 75 92 Q66 86 70 72 L30 72 Q34 86 25 92 Q17 77 22 58Z" fill="${h}"/>`;
    front=`<path d="M28 52 Q27 28 52 27 Q74 28 73 47 Q61 36 45 41 Q34 44 28 52Z" fill="${h}"/>
      <g transform="translate(71 37)"><circle cx="0" cy="-4" r="3.6" fill="#FFF3B0"/><circle cx="4" cy="0" r="3.6" fill="#FFF3B0"/><circle cx="0" cy="4" r="3.6" fill="#FFF3B0"/><circle cx="-4" cy="0" r="3.6" fill="#FFF3B0"/><circle r="2.6" fill="#F2A65A"/></g>`;
  }else if(name==='Lily'){ // twin buns
    const h='#2E2C38';
    back=`<circle cx="31" cy="27" r="10" fill="${h}"/><circle cx="69" cy="27" r="10" fill="${h}"/>
      <path d="M27 57 Q26 30 50 29 Q74 30 73 57Z" fill="${h}"/>`;
    front=`<path d="M28 49 Q29 31 50 31 Q71 31 72 49 Q66 42 59 45 Q55 39 50 45 Q45 39 41 45 Q34 42 28 49Z" fill="${h}"/>
      <rect x="36" y="31" width="5" height="4" rx="2" transform="rotate(-30 38 33)" fill="#F7C6D9"/><rect x="59" y="31" width="5" height="4" rx="2" transform="rotate(30 62 33)" fill="#F7C6D9"/>`;
  }else{ // Livia: high ponytail
    const h='#22222A';
    back=`<path d="M64 30 Q92 26 88 66 Q82 52 70 46Z" fill="${h}"/>
      <path d="M27 56 Q26 29 50 28 Q74 29 73 56Z" fill="${h}"/>`;
    front=`<path d="M28 49 Q29 30 50 30 Q71 30 72 49 Q63 39 52 41 Q40 39 28 49Z" fill="${h}"/>
      <circle cx="68" cy="31" r="3.4" fill="#9CC2EE"/>`;
  }
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${name} 的头像"><defs><clipPath id="${id}"><circle cx="50" cy="50" r="50"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect width="100" height="100" fill="${m.hex}" opacity=".22"/>${back}${body}${face}${front}</g></svg>`;
}

/* ---------- state & storage ---------- */
let S={expenses:{},items:{},members:{},cleanlog:{}};
let db=null, mode='loading';
let me=null; try{me=localStorage.getItem('hz-me')}catch(e){}
if(!NAMES.includes(me)) me=null;
const LKEY='hz-local-data';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY)||'{}');COLS.forEach(c=>S[c]=d[c]||{})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
let readOnly=false;
function failMsg(e){
  const code=e&&e.code;
  if(code==='invalid_argument'){readOnly=true;return '保存失败：你目前没有编辑权限，请让创建者把你加为编辑者'}
  if(code==='quota_exceeded') return '存储空间已满，请先删除一些旧记录';
  if(code==='revoked') return '访问权限已变更，请刷新页面';
  return '网络不稳定，没保存成功，请再试一次';
}
async function put(col,id,data){
  if(db){
    try{await db.collection(col).doc(id).set(data);return true}
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));try{await db.collection(col).doc(id).set(data);return true}catch(e2){toast(failMsg(e2));return false}}
      toast(failMsg(e));return false;
    }
  }
  S[col][id]=data;saveLocal();render();return true;
}
async function del(col,id){
  if(db){try{await db.collection(col).doc(id).delete();return true}catch(e){toast(failMsg(e));return false}}
  delete S[col][id];saveLocal();render();return true;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'¥'+(Math.round(v*100)/100).toFixed(2);
let tt;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---------- money logic ---------- */
function list(col){return Object.entries(S[col]).map(([id,v])=>({id,...v}))}
function balances(){
  const b={};NAMES.forEach(n=>b[n]=0);
  list('expenses').filter(e=>!e.settled&&Array.isArray(e.split)&&e.split.length).forEach(e=>{
    const amt=Number(e.amount)||0, share=amt/e.split.length;
    if(b[e.payer]!==undefined) b[e.payer]+=amt;
    e.split.forEach(n=>{if(b[n]!==undefined) b[n]-=share});
  });
  NAMES.forEach(n=>b[n]=Math.round(b[n]*100)/100);
  return b;
}
function transfers(b){
  const cr=[],dr=[];
  NAMES.forEach(n=>{if(b[n]>0.004)cr.push({n,v:b[n]});else if(b[n]<-0.004)dr.push({n,v:-b[n]})});
  cr.sort((a,c)=>c.v-a.v);dr.sort((a,c)=>c.v-a.v);
  const out=[];let i=0,j=0;
  while(i<dr.length&&j<cr.length){
    const x=Math.min(dr[i].v,cr[j].v);
    if(x>0.004) out.push({from:dr[i].n,to:cr[j].n,v:Math.round(x*100)/100});
    dr[i].v-=x;cr[j].v-=x;
    if(dr[i].v<0.005)i++; if(cr[j].v<0.005)j++;
  }
  return out;
}

/* ---------- chore logic ---------- */
const EPOCH=new Date(2026,0,5); // a Monday
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function weekIdx(mon){return Math.round((mon-EPOCH)/(7*864e5))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function areaFor(name,mon){const i=NAMES.indexOf(name);return ((i+weekIdx(mon))%4+4)%4}
function whoFor(area,mon){return NAMES.find(n=>areaFor(n,mon)===area)}
const thisMon=()=>mondayOf(new Date());
const md=d=>(d.getMonth()+1)+'/'+d.getDate();

/* ---------- items logic ---------- */
const ST={ok:'充足',low:'快用完',out:'用完了'};
function nextBuyer(it){return NAMES[((Number(it.buyerIdx)||0)%4+4)%4]}

/* ---------- render ---------- */
function renderCrew(){
  const b=balances(),mon=thisMon();
  document.getElementById('crew').innerHTML=MATES.map(m=>{
    const v=b[m.n];const bal=v>0.004?`<span class="pos">应收 ${money(v)}</span>`:v<-0.004?`<span class="neg">应付 ${money(-v)}</span>`:'<span style="color:var(--muted)">已两清</span>';
    const st=(S.members[m.n]&&S.members[m.n].status)||'';
    return `<button class="mate${me===m.n?' me':''}" style="--c:${m.c}" data-act="me" data-n="${m.n}" aria-pressed="${me===m.n}">
      ${avatar(m.n)}<div class="nm">${m.n}${me===m.n?'（我）':''}</div>
      <div class="tag">本周：${AREAS[areaFor(m.n,mon)].a}${st?' · '+esc(st):''}</div>
      <div class="bal">${bal}</div></button>`}).join('');
  document.getElementById('meHint').textContent=me?`你好 ${me}，下面是需要你处理的事`:'点自己的头像，告诉管家你是谁';
}

function renderHome(){
  const el=document.getElementById('p-home');
  const b=balances(),tr=transfers(b),mon=thisMon();
  const todos=[];
  if(me){
    tr.filter(t=>t.from===me).forEach(t=>todos.push(`转给 <b>${t.to}</b> ${money(t.v)}`));
    tr.filter(t=>t.to===me).forEach(t=>todos.push(`等 <b>${t.from}</b> 转你 ${money(t.v)}`));
    const a=areaFor(me,mon),done=S.cleanlog[iso(mon)+'_'+a];
    if(!done||!done.done) todos.push(`本周打扫 <b>${AREAS[a].a}</b>：${AREAS[a].w}`);
    list('items').filter(i=>i.status!=='ok'&&nextBuyer(i)===me).forEach(i=>todos.push(`去买 <b>${esc(i.name)}</b>（${ST[i.status]}）`));
  }
  const low=list('items').filter(i=>i.status==='low'||i.status==='out');
  const choresLeft=AREAS.map((A,a)=>({a,A,who:whoFor(a,mon),d:S.cleanlog[iso(mon)+'_'+a]})).filter(x=>!(x.d&&x.d.done));
  el.innerHTML=`
    ${me?`<h2>我的待办</h2><div class="box">${todos.length?`<ul class="todo">${todos.map(t=>`<li>${t}</li>`).join('')}</ul>`:'<p class="empty">全部搞定，今天可以安心躺平。</p>'}</div>`:''}
    <h2>谁该给谁转账</h2>
    <div class="box">${tr.length?tr.map(t=>`<div class="transfer"><span class="dot">${avatar(t.from)}</span>${t.from}<span class="arrow">转给</span><span class="dot">${avatar(t.to)}</span>${t.to}<span class="grow" style="flex:1"></span><span class="amt">${money(t.v)}</span></div>`).join(''):'<p class="empty">目前没有未结清的费用。</p>'}</div>
    <h2>本周还没打扫（${md(mon)} 起）</h2>
    <div class="box">${choresLeft.length?choresLeft.map(x=>`<div class="row"><span class="dot">${avatar(x.who)}</span><div class="grow"><div class="t">${x.A.a}</div><div class="m">${x.who} 负责</div></div></div>`).join(''):'<p class="empty">这周四个区域都打扫完了。</p>'}</div>
    <h2>需要补货</h2>
    <div class="box">${low.length?low.map(i=>`<div class="row"><div class="grow"><div class="t">${esc(i.name)}</div><div class="m">轮到 ${nextBuyer(i)} 买</div></div><span class="status ${i.status}">${ST[i.status]}</span></div>`).join(''):'<p class="empty">公共物品都还够用。</p>'}</div>`;
}

let showHistory=false;
function renderMoney(){
  const b=balances(),tr=transfers(b);
  const all=list('expenses').sort((a,c)=>(c.date||'').localeCompare(a.date||'')||(c.createdAt||0)-(a.createdAt||0));
  const open=all.filter(e=>!e.settled),done=all.filter(e=>e.settled);
  const ym=today().slice(0,7);
  const monthTotal=all.filter(e=>(e.date||'').startsWith(ym)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const openTotal=open.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const row=e=>`<div class="row"><span class="dot">${avatar(e.payer)}</span><div class="grow"><div class="t">${esc(e.title)}</div>
    <div class="m">${esc(e.cat||'')} · ${esc(e.date||'')} · ${esc(e.payer)} 付 · ${(e.split||[]).length===4?'四人平摊':esc((e.split||[]).join('、'))+' 分摊'}</div></div>
    <span class="amt">${money(Number(e.amount)||0)}</span>${e.settled?'':`<button class="x" data-act="delExp" data-id="${e.id}" aria-label="删除 ${esc(e.title)}">×</button>`}</div>`;
  document.getElementById('moneyBody').innerHTML=`
    <h2>未结清</h2>
    <div class="box">
      <div class="stat"><div>未结清合计<b>${money(openTotal)}</b></div><div>本月总支出<b>${money(monthTotal)}</b></div><div>人均（本月）<b>${money(monthTotal/4)}</b></div></div>
      ${open.length?open.map(row).join(''):'<p class="empty">还没有未结清的费用，上面记一笔吧。</p>'}
    </div>
    <h2>结算方案</h2>
    <div class="box">
      ${tr.length?tr.map(t=>`<div class="transfer"><span class="dot">${avatar(t.from)}</span>${t.from}<span class="arrow">转给</span><span class="dot">${avatar(t.to)}</span>${t.to}<span style="flex:1"></span><span class="amt">${money(t.v)}</span></div>`).join('')+
      `<div class="right" style="margin-top:12px"><span class="m" style="font-size:13px;color:var(--muted)">按最少转账次数计算。大家转完后点这里：</span><button class="btn" data-act="settle">全部标记为已结清</button></div>`
      :'<p class="empty">大家已经两清。</p>'}
    </div>
    ${done.length?`<details ${showHistory?'open':''} id="hist"><summary>已结清的记录（${done.length} 笔）</summary><div class="box" style="margin-top:8px">${done.slice(0,50).map(row).join('')}</div></details>`:''}`;
  const h=document.getElementById('hist');if(h)h.addEventListener('toggle',()=>showHistory=h.open);
}

function renderChores(){
  const mon=thisMon(),key=iso(mon);
  const cards=AREAS.map((A,a)=>{
    const who=whoFor(a,mon),d=S.cleanlog[key+'_'+a],done=d&&d.done;
    return `<div class="chore${done?' done':''}" style="--c:${mate(who).c}">${avatar(who)}<div class="grow" style="flex:1">
      <div class="area">${A.a}</div><div class="what">${A.w}</div>
      <div class="what">${who} 负责${done?` · ${esc(d.by)} 于 ${esc(d.at)} 完成`:''}</div></div>
      <button class="btn sm ${done?'ghost':''}" data-act="chore" data-a="${a}">${done?'撤销':'打扫完了'}</button></div>`}).join('');
  const weeks=[0,1,2,3].map(k=>{const m=new Date(mon);m.setDate(m.getDate()+7*k);return m});
  document.getElementById('p-chores').innerHTML=`
    <h2>本周值日（${md(mon)} – ${md(new Date(mon.getTime()+6*864e5))}）</h2>
    <div class="chores">${cards}</div>
    <h2>接下来四周轮班</h2>
    <div class="box table-wrap"><table class="rota"><thead><tr><th>周</th>${AREAS.map(A=>`<th>${A.a}</th>`).join('')}</tr></thead>
    <tbody>${weeks.map((m,k)=>`<tr><td>${k===0?'本周':md(m)+' 起'}</td>${AREAS.map((A,a)=>`<td>${whoFor(a,m)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="m" style="font-size:13px;color:var(--muted)">每周一自动轮换，四个区域每人轮一遍。完成后点“打扫完了”，大家都能看到。</p>`;
}

function renderItems(){
  const items=list('items').sort((a,c)=>{const o={out:0,low:1,ok:2};return (o[a.status]??2)-(o[c.status]??2)||(a.name||'').localeCompare(c.name||'')});
  document.getElementById('itemsBody').innerHTML=`
    <h2>物品清单</h2>
    <div class="box">${items.length?items.map(i=>`<div class="row" style="flex-wrap:wrap">
      <div class="grow"><div class="t">${esc(i.name)}</div>
      <div class="m">下次轮到 ${nextBuyer(i)} 买${i.lastBy?` · 上次 ${esc(i.lastBy)} 于 ${esc(i.lastAt)} 补货`:''}</div></div>
      <div class="seg" role="group" aria-label="${esc(i.name)} 库存">${['ok','low','out'].map(s=>`<button class="${s}${i.status===s?' on':''}" data-act="itemSt" data-id="${i.id}" data-s="${s}" aria-pressed="${i.status===s}">${ST[s]}</button>`).join('')}</div>
      <button class="btn sm" data-act="restock" data-id="${i.id}">已补货</button>
      <button class="x" data-act="delItem" data-id="${i.id}" aria-label="删除 ${esc(i.name)}">×</button></div>`).join(''):'<p class="empty">还没有登记物品。先把卷纸、洗洁精、垃圾袋这些加进来吧。</p>'}</div>
    <p class="m" style="font-size:13px;color:var(--muted)">谁发现快用完了就点一下“快用完”，总览页会提醒轮到的人去买；买回来点“已补货”，自动轮到下一位。</p>`;
}

function renderMates(){
  const b=balances(),mon=thisMon();
  document.getElementById('p-mates').innerHTML=`<div class="mates">${MATES.map(m=>{
    const d=S.members[m.n]||{};const v=b[m.n];
    const items=list('items').filter(i=>i.status!=='ok'&&nextBuyer(i)===m.n).map(i=>esc(i.name));
    return `<div class="card" style="--c:${m.c}">
      <div class="head">${avatar(m.n)}<div><div class="nm">${m.n}</div><div class="m" style="font-size:13px;color:var(--muted)">${d.status?esc(d.status):'还没设置状态'}${d.updatedAt?' · 更新于 '+esc(d.updatedAt):''}</div></div></div>
      <dl><dt>本周值日</dt><dd>${AREAS[areaFor(m.n,mon)].a}</dd>
      <dt>账户</dt><dd>${v>0.004?`<span class="pos">应收 ${money(v)}</span>`:v<-0.004?`<span class="neg">应付 ${money(-v)}</span>`:'已两清'}</dd>
      <dt>待买</dt><dd>${items.length?items.join('、'):'无'}</dd>
      ${d.note?`<dt>留言</dt><dd>${esc(d.note)}</dd>`:''}</dl>
      <div class="edit"><select data-f="status" data-n="${m.n}" aria-label="${m.n} 的状态"><option value="">选择状态</option>${STATUS_OPTS.map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <textarea data-f="note" data-n="${m.n}" maxlength="140" placeholder="留言，例如：今晚晚归别反锁门" aria-label="${m.n} 的留言">${esc(d.note||'')}</textarea>
      <div class="right"><button class="btn sm" data-act="saveMate" data-n="${m.n}">保存</button></div></div></div>`}).join('')}</div>`;
}

function renderForms(){
  const opts=NAMES.map(n=>`<option ${n===me?'selected':''}>${n}</option>`).join('');
  const ps=document.getElementById('payerSel');const keep=ps.dataset.touched?ps.value:null;ps.innerHTML=opts;if(keep)ps.value=keep;
  const bs=document.getElementById('buyerSel');const keepB=bs.dataset.touched?bs.value:null;bs.innerHTML=opts;if(keepB)bs.value=keepB;
  const sc=document.getElementById('splitChecks');
  if(!sc.children.length) sc.innerHTML=NAMES.map(n=>`<label class="chk"><input type="checkbox" name="split" value="${n}" checked>${avatar(n)}${n}</label>`).join('');
  const dt=document.querySelector('#expForm [name=date]');if(!dt.value)dt.value=today();
}

function render(){
  // keep unsaved text in mate cards across live updates
  const drafts={};document.querySelectorAll('#p-mates [data-f]').forEach(el=>{if(el.dataset.dirty)drafts[el.dataset.n+el.dataset.f]=el.value});
  renderCrew();renderHome();renderMoney();renderChores();renderItems();renderMates();renderForms();
  document.querySelectorAll('#p-mates [data-f]').forEach(el=>{const k=el.dataset.n+el.dataset.f;if(k in drafts){el.value=drafts[k];el.dataset.dirty='1'}});
}

/* ---------- events ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{
  const t=e.target.closest('button[data-tab]');if(!t)return;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b===t));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t.dataset.tab));
});
document.getElementById('payerSel').addEventListener('change',e=>e.target.dataset.touched=1);
document.getElementById('buyerSel').addEventListener('change',e=>e.target.dataset.touched=1);
document.getElementById('p-mates').addEventListener('input',e=>{if(e.target.dataset.f)e.target.dataset.dirty='1'});

document.getElementById('expForm').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  const split=[...f.querySelectorAll('[name=split]:checked')].map(x=>x.value);
  const amount=Math.round(parseFloat(f.amount.value)*100)/100;
  if(!split.length){toast('至少选一个分摊人');return}
  if(!(amount>0)){toast('请填写正确的金额');return}
  const ok=await put('expenses',uid(),{title:f.title.value.trim(),amount,payer:f.payer.value,split,cat:f.cat.value,date:f.date.value,settled:false,createdAt:Date.now(),by:me||''});
  if(ok){f.title.value='';f.amount.value='';toast('已保存这笔费用')}
});
document.getElementById('itemForm').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;const name=f.name.value.trim();if(!name)return;
  const ok=await put('items',uid(),{name,status:'ok',buyerIdx:NAMES.indexOf(f.buyer.value),createdAt:Date.now()});
  if(ok){f.name.value='';toast('已登记 '+name)}
});

document.body.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  if(act==='me'){me=t.dataset.n;try{localStorage.setItem('hz-me',me)}catch(_){}
    const ps=document.getElementById('payerSel');delete ps.dataset.touched;render();return}
  if(act==='delExp'){const x=S.expenses[id];if(x&&confirm(`删除“${x.title}”这笔费用？`)){if(await del('expenses',id))toast('已删除')}}
  if(act==='settle'){
    if(!confirm('确认大家都已按结算方案转完账？未结清的费用会全部移到历史记录。'))return;
    const open=list('expenses').filter(x=>!x.settled);t.disabled=true;
    for(const x of open){const {id:xid,...rest}=x;if(!await put('expenses',xid,{...rest,settled:true,settledAt:today()}))break}
    t.disabled=false;toast('已全部结清');
  }
  if(act==='chore'){
    const a=Number(t.dataset.a),key=iso(thisMon())+'_'+a,d=S.cleanlog[key];
    if(d&&d.done){if(await del('cleanlog',key))toast('已撤销')}
    else{if(await put('cleanlog',key,{done:true,by:me||whoFor(a,thisMon()),at:today()}))toast(AREAS[a].a+' 打扫完成')}
  }
  if(act==='itemSt'){const it=S.items[id];if(it&&it.status!==t.dataset.s)await put('items',id,{...it,status:t.dataset.s})}
  if(act==='restock'){const it=S.items[id];if(!it)return;
    const buyer=me||nextBuyer(it);
    if(await put('items',id,{...it,status:'ok',buyerIdx:(NAMES.indexOf(buyer)+1)%4,lastBy:buyer,lastAt:today()}))toast(`已补货，下次轮到 ${NAMES[(NAMES.indexOf(buyer)+1)%4]}`)}
  if(act==='delItem'){const it=S.items[id];if(it&&confirm(`删除“${it.name}”？`))await del('items',id)}
  if(act==='saveMate'){
    const n=t.dataset.n;const st=document.querySelector(`#p-mates select[data-n="${n}"]`),nt=document.querySelector(`#p-mates textarea[data-n="${n}"]`);
    const d=new Date();
    if(await put('members',n,{status:st.value,note:nt.value.trim(),updatedAt:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`})){
      delete st.dataset.dirty;delete nt.dataset.dirty;toast('已保存 '+n+' 的状态');render()}
  }
});

/* ---------- boot ---------- */
const banner=document.getElementById('banner');
function goLocal(){
  if(mode!=='loading')return;mode='local';loadLocal();
  banner.textContent='本地模式：数据只保存在这台设备上。通过分享链接登录打开后，四个人的数据会实时同步。';
  render();
}
render();
if(!window.claude||typeof window.claude.use!=='function'){goLocal()}
else{
  window.claude.use('db').then(d=>{
    if(!d){goLocal();return}
    db=d;mode='db';banner.classList.add('hide');
    COLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{
        const m={};snap.docs.forEach(doc=>{if(doc.exists)m[doc.id]=doc.data()});S[c]=m;render();
      },err=>{
        if(err&&err.code==='revoked'){banner.textContent='访问权限已变更，请刷新页面。';banner.classList.remove('hide')}
        else if(err&&err.code==='unavailable'){banner.textContent='连接中断，刷新页面即可恢复同步。';banner.classList.remove('hide')}
      });
    });
  }).catch(goLocal);
}
})();
</script>
</body>
</html>
